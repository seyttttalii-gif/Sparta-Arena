
name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Cikti klasorlerini hazirla
        run: |
          mkdir -p apk-output
          : > build.log

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Android SDK yolunu ayarla
        shell: bash
        run: |
          mkdir -p "$HOME/.android/sdk"
          echo "ANDROID_HOME=$HOME/.android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/.android/sdk" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$HOME/.android/sdk" >> "$GITHUB_ENV"

      - name: Android SDK araclarini kur
        uses: android-actions/setup-android@v4

      - name: SDK ve avdmanager yolunu duzelt
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$ANDROID_HOME"
          SDKMANAGER="$(find "$SDK/cmdline-tools" \
            -type f -name sdkmanager -path '*/bin/sdkmanager' \
            -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "HATA: sdkmanager bulunamadi."
            find "$SDK" -maxdepth 7 -name sdkmanager -print || true
            exit 1
          fi

          SDK_TOOLS_BIN="$(dirname "$SDKMANAGER")"
          SDK_TOOLS_VERSION_DIR="$(dirname "$SDK_TOOLS_BIN")"
          AVDMANAGER="$SDK_TOOLS_BIN/avdmanager"

          if [ ! -x "$AVDMANAGER" ]; then
            echo "HATA: avdmanager bulunamadi veya calistirilamiyor."
            find "$SDK/cmdline-tools" -name avdmanager -print || true
            exit 1
          fi

          mkdir -p "$SDK/tools/bin"

          ln -sfn "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"
          ln -sfn "$AVDMANAGER" "$SDK/tools/bin/avdmanager"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/avdmanager" ]; then
            if [ -L "$SDK/cmdline-tools/latest" ]; then
              rm -f "$SDK/cmdline-tools/latest"
            elif [ -d "$SDK/cmdline-tools/latest" ]; then
              mv "$SDK/cmdline-tools/latest" \
                "$SDK/cmdline-tools/latest.previous"
            fi

            ln -s "$SDK_TOOLS_VERSION_DIR" \
              "$SDK/cmdline-tools/latest"
          fi

          touch "$SDK/repositories.cfg"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses \
            >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "ndk;25.1.8937393"

          test -x "$SDK/cmdline-tools/latest/bin/avdmanager"
          test -x "$SDK/tools/bin/avdmanager"
          test -d "$SDK/platforms/android-34"
          test -d "$SDK/build-tools/35.0.0"
          test -d "$SDK/ndk/25.1.8937393"

          echo "ANDROIDNDK=$SDK/ndk/25.1.8937393" \
            >> "$GITHUB_ENV"

          "$SDK/cmdline-tools/latest/bin/avdmanager" list target

      - name: Sistem bagimliliklarini kur
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Proje ZIP dosyasini bul ve ac
        shell: bash
        run: |
          set -eux

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -name 'SPARTA_ARENA_V57_ANDROID_READY.zip' \
            -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 3 -type f \
              -iname '*.zip' -not -path './.git/*' \
              -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Proje ZIP dosyasi bulunamadi."
            exit 1
          fi

          rm -rf unpacked
          mkdir -p unpacked
          unzip -oq "$ZIP_FILE" -d unpacked

          SPEC="$(find unpacked -name buildozer.spec -print -quit)"

          if [ -z "$SPEC" ]; then
            echo "HATA: buildozer.spec bulunamadi."
            find unpacked -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proje klasoru: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f | head -200

      - name: Buildozer ve Cython kur
        shell: bash
        run: |
          set -eux
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "Cython>=3.1,<3.2" \
            "buildozer==1.5.0"

          cython --version
          buildozer --version

      - name: Buildozer ayarlarini duzenle
        shell: bash
        run: |
          set -eux
          cd "$PROJECT_DIR"

          python - <<'PY'
          from pathlib import Path
          import os

          spec = Path("buildozer.spec")
          lines = spec.read_text(encoding="utf-8").splitlines()

          if "[app]" not in lines:
              raise SystemExit("HATA: [app] bolumu bulunamadi.")

          start = lines.index("[app]")
          end = next(
              (i for i in range(start + 1, len(lines))
               if lines[i].strip().startswith("[")
               and lines[i].strip().endswith("]")),
              len(lines)
          )

          section = lines[start + 1:end]

          if Path("app/main.py").is_file():
              source_dir = "app"
          elif Path("main.py").is_file():
              source_dir = "."
          else:
              raise SystemExit(
                  "HATA: app/main.py veya main.py bulunamadi."
              )

          settings = {
              "source.dir": source_dir,
              "source.include_exts":
                  "py,pyx,pxd,pyd,so,png,jpg,jpeg,bmp,gif,webp,"
                  "svg,atlas,ttf,otf,mp3,ogg,wav,flac,mid,midi,"
                  "json,txt,dat,bin,ico,mp4",
              "p4a.branch": "v2024.01.21",
              "p4a.local_recipes": "./p4a-recipes",
              "android.accept_sdk_license": "True",
              "android.sdk_path": os.environ["ANDROID_HOME"],
              "android.ndk_path": os.path.join(
                  os.environ["ANDROID_HOME"],
                  "ndk",
                  "25.1.8937393"
              ),
              "android.api": "34",
              "android.minapi": "24",
              "android.build_tools_version": "35.0.0",
              "android.archs": "arm64-v8a",
          }

          for key, value in settings.items():
              section = [
                  line for line in section
                  if not line.strip().startswith(key + " =")
              ]
              section.append(f"{key} = {value}")

          lines = lines[:start + 1] + section + lines[end:]
          spec.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("Buildozer ayarlari guncellendi.")
          PY

      - name: Pygame 2.6.1 Cython tarifini olustur
        shell: bash
        run: |
          set -eux
          cd "$PROJECT_DIR"
          mkdir -p p4a-recipes/pygame

          cat > p4a-recipes/pygame/__init__.py <<'PY'
          import glob
          import sh

          from pythonforandroid.logger import shprint
          from pythonforandroid.recipes.pygame import Pygame2Recipe
          from pythonforandroid.util import current_directory

          class Pygame261Recipe(Pygame2Recipe):
              version = "2.6.1"
              url = (
                  "https://github.com/pygame/pygame/"
                  "archive/refs/tags/{version}.tar.gz"
              )

              def build_compiled_components(self, arch):
                  env = self.get_recipe_env(arch)
                  build_dir = self.get_build_dir(arch.arch)
                  hostpython = sh.Command(self.hostpython_location)
                  cython = sh.Command("cython")

                  with current_directory(build_dir):
                      try:
                          shprint(
                              hostpython,
                              "setup.py",
                              "build_ext",
                              _env=env
                          )
                      except sh.ErrorReturnCode_1:
                          print(
                              "Host Python Cython olmadan derleyemedi; "
                              "Cython dosyalari olusturuluyor.",
                              flush=True
                          )

                          pyx_files = glob.glob(
                              "**/*.pyx", recursive=True
                          )

                          if not pyx_files:
                              raise RuntimeError(
                                  "Pygame kaynaklarinda .pyx dosyasi "
                                  "bulunamadi."
                              )

                          for pyx_file in pyx_files:
                              shprint(
                                  cython, "-3", pyx_file, _env=env
                              )

                          shprint(
                              hostpython,
                              "setup.py",
                              "build_ext",
                              "-v",
                              _env=env
                          )

                      build_lib = glob.glob("build/lib.*")
                      if not build_lib:
                          raise RuntimeError(
                              "Pygame derlendi ancak build/lib klasoru "
                              "olusturulamadi."
                          )

                      shprint(
                          sh.find,
                          build_lib[0],
                          "-name",
                          "*.o",
                          "-exec",
                          env["STRIP"],
                          "{}",
                          ";",
                          _env=env
                      )

          recipe = Pygame261Recipe()
          PY

          python -m py_compile p4a-recipes/pygame/__init__.py

      - name: Eski derleme dosyalarini temizle
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          rm -rf .buildozer bin

      - name: APK derle ve gunlugu kaydet
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          buildozer -v android debug 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

          find "$PROJECT_DIR/bin" -maxdepth 1 \
            -type f -name '*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/apk-output/" \;

          if ! find "$GITHUB_WORKSPACE/apk-output" \
            -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "HATA: Derleme sonrasi APK bulunamadi."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/apk-output"

      - name: APK dosyasini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK
          path: apk-output/*.apk
          if-no-files-found: warn

      - name: Derleme gunlugunu yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-Build-Log
          path: build.log
          if-no-files-found: warn
