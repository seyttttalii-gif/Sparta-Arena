
name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Android SDK kur
        uses: android-actions/setup-android@v4

      - name: Android SDK yolunu ve lisanslari duzelt
        shell: bash
        run: |
          set -eux

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$(find "$SDK" -type f -name sdkmanager -path '*/bin/sdkmanager' -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "HATA: sdkmanager bulunamadi."
            find "$SDK" -maxdepth 6 -iname '*sdkmanager*' -print || true
            exit 1
          fi

          chmod +x "$SDKMANAGER"
          mkdir -p "$SDK/tools/bin"
          ln -sf "$SDKMANAGER" "$SDK/tools/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;35.0.0" "ndk;25.1.8937393"

      - name: Sistem bagimliliklarini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Proje ZIP dosyasini bul ve ac
        shell: bash
        run: |
          set -eux

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Depoda ZIP dosyasi bulunamadi."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          mkdir -p unpacked
          unzip -oq "$ZIP_FILE" -d unpacked

          SPEC="$(find unpacked -name buildozer.spec -print -quit)"
          if [ -z "$SPEC" ]; then
            echo "HATA: ZIP icinde buildozer.spec bulunamadi."
            find unpacked -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proje klasoru: $PROJECT_DIR"

          find "$PROJECT_DIR" -maxdepth 3 -type f | head -200

      - name: Buildozer ve Cython kur
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython>=3.1,<3.2" "buildozer==1.5.0"

      - name: Buildozer ayarlarini duzenle
        shell: bash
        run: |
          set -eux
          cd "$PROJECT_DIR"

          python - <<'PY'
          from pathlib import Path
          import os

          path = Path("buildozer.spec")
          content = path.read_text(encoding="utf-8")

          if "[app]" not in content:
              raise SystemExit("HATA: buildozer.spec icinde [app] bolumu yok.")

          source_dir = "app" if Path("app/main.py").exists() else "."
          settings = {
              "source.dir": source_dir,
              "p4a.branch": "v2024.01.21",
              "android.accept_sdk_license": "True",
              "android.sdk_path": os.environ["ANDROID_HOME"],
              "android.ndk_path": os.path.join(
                  os.environ["ANDROID_HOME"], "ndk", "25.1.8937393"
              ),
              "android.api": "34",
              "android.minapi": "24",
              "android.build_tools_version": "35.0.0",
          }

          lines = content.splitlines()
          start = lines.index("[app]")
          end = next(
              (i for i in range(start + 1, len(lines))
               if lines[i].strip().startswith("[") and lines[i].strip().endswith("]")),
              len(lines)
          )

          section = lines[start + 1:end]
          for key, value in settings.items():
              section = [
                  line for line in section
                  if not line.strip().startswith(key + " =")
              ]
              section.append(f"{key} = {value}")

          lines = lines[:start + 1] + section + lines[end:]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("buildozer.spec ayarlari guncellendi.")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Pygame icin yerel recipe hazirla
        shell: bash
        run: |
          set -eux
          cd "$PROJECT_DIR"
          mkdir -p p4a-recipes/pygame

          cat > p4a-recipes/pygame/__init__.py <<'PY'
          from pythonforandroid.recipes.pygame import Pygame2Recipe

          class Pygame261Recipe(Pygame2Recipe):
              version = "2.6.1"
              url = "https://github.com/pygame/pygame/archive/refs/tags/{version}.tar.gz"
              hostpython_prerequisites = ["setuptools", "cython>=3.1"]

          recipe = Pygame261Recipe()
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path("buildozer.spec")
          lines = path.read_text(encoding="utf-8").splitlines()
          start = lines.index("[app]")
          end = next(
              (i for i in range(start + 1, len(lines))
               if lines[i].strip().startswith("[") and lines[i].strip().endswith("]")),
              len(lines)
          )

          section = lines[start + 1:end]
          key = "p4a.local_recipes"
          section = [
              line for line in section
              if not line.strip().startswith(key + " =")
          ]
          section.append("p4a.local_recipes = ./p4a-recipes")
          lines = lines[:start + 1] + section + lines[end:]
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Eski derleme dosyalarini temizle
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          rm -rf .buildozer bin

      - name: APK derle
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: APK ve hata logunu yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-Build-Files
          path: |
            unpacked/**/bin/*.apk
            build.log
          if-no-files-found: warn
