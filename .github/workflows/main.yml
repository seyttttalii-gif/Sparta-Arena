name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem bağımlılıklarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential autoconf automake \
            libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Android SDK araçlarını kur
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'

      - name: Android SDK ve NDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find \
              /usr/local/lib/android/sdk \
              "$HOME/.android/sdk" \
              -type f -path '*/cmdline-tools/*/bin/sdkmanager' \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "HATA: sdkmanager bulunamadı."
            exit 1
          fi

          SDK_ROOT="${SDKMANAGER%%/cmdline-tools/*}"

          if [ "$SDK_ROOT" = "$SDKMANAGER" ]; then
            echo "HATA: Android SDK dizini belirlenemedi."
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.3.13750724"

          if [ ! -x "$SDK_ROOT/ndk/27.3.13750724/ndk-build" ]; then
            echo "HATA: NDK kurulumu tamamlanmadı."
            exit 1
          fi

          echo "ANDROID_NDK=$SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "SDK ve NDK hazır: $SDK_ROOT"

      - name: Proje ZIP dosyasını bul ve aç
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -iname '*.zip' -not -path './.git/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Proje ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "Proje ZIP dosyası: $ZIP_FILE"

          mkdir -p unpacked
          unzip -oq "$ZIP_FILE" -d unpacked

          SPEC="$(find unpacked -name buildozer.spec -print -quit)"

          if [ -z "$SPEC" ]; then
            echo "HATA: ZIP içinde buildozer.spec bulunamadı."
            find unpacked -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT="$(dirname "$SPEC")"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proje dizini: $PROJECT"

      - name: Pygame derleme tarifini hazırla
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(dirname "$(find unpacked -name buildozer.spec -print -quit)")"
          mkdir -p "$PROJECT/p4a-recipes/pygame"

          if [ ! -f "$PROJECT/p4a-recipes/pygame/__init__.py" ]; then
            cat > "$PROJECT/p4a-recipes/pygame/__init__.py" <<'PY'
          import sh
          from pythonforandroid.recipes.pygame import Pygame2Recipe
          from pythonforandroid.toolchain import current_directory, shprint

          class Pygame261Recipe(Pygame2Recipe):
              version = "2.6.1"
              url = "https://github.com/pygame/pygame/archive/refs/tags/{version}.tar.gz"
              hostpython_prerequisites = [
                  "setuptools",
                  "Cython>=3.1,<3.2",
              ]

              def build_compiled_components(self, arch):
                  env = self.get_recipe_env(arch)

                  with current_directory(self.get_build_dir(arch.arch)):
                      hostpython = sh.Command(self.ctx.hostpython)

                      try:
                          shprint(hostpython, "setup.py", "build_ext", _env=env)
                      except sh.ErrorReturnCode_1:
                          print(
                              "İlk derleme Cython nedeniyle durdu; "
                              "PYX dosyaları hazırlanıyor.",
                              flush=True,
                          )

                      shprint(
                          sh.find, ".",
                          "-iname", "*.pyx",
                          "-exec", self.ctx.cython, "{}", ";",
                          _env=env,
                      )

                      shprint(
                          hostpython, "setup.py", "build_ext", "-v",
                          _env=env,
                      )

          recipe = Pygame261Recipe()
          PY
          fi

          # Önceki yerel PyJNIus tarifi eski 1.6.1 tarifini temel alıyordu.
          # P4A develop, PyJNIus 1.7.0 için güncel tarifi kendi içinde sağlar.
          rm -rf "$PROJECT/p4a-recipes/pyjnius"

          echo "Yerel tarifler:"
          find "$PROJECT/p4a-recipes" -maxdepth 2 -name __init__.py -print

      - name: Buildozer ayarlarını düzenle
        shell: bash
        run: |
          set -euo pipefail

          python - "$PROJECT_DIR/buildozer.spec" <<'PY'
          import os
          import re
          import sys

          spec = sys.argv[1]

          with open(spec, "r", encoding="utf-8") as file:
              lines = file.readlines()

          start = next(
              (i for i, line in enumerate(lines)
               if line.strip().lower() == "[app]"),
              None,
          )

          if start is None:
              raise SystemExit("HATA: buildozer.spec içinde [app] bölümü yok.")

          end = len(lines)
          for i in range(start + 1, len(lines)):
              if re.match(r"^\s*\[.+\]\s*$", lines[i]):
                  end = i
                  break

          sdk = os.environ["ANDROID_HOME"]
          settings = {
              "android.sdk_path": sdk,
              "android.ndk_path": os.path.join(
                  sdk, "ndk", "27.3.13750724"
              ),
              "android.api": "35",
              "android.minapi": "24",
              "android.build_tools_version": "35.0.0",
              "android.accept_sdk_license": "True",
              "p4a.branch": "develop",
              "p4a.local_recipes": "./p4a-recipes",
          }

          section = lines[start + 1:end]

          for key, value in settings.items():
              pattern = re.compile(
                  r"^\s*" + re.escape(key) + r"\s*="
              )
              found = False

              for i, line in enumerate(section):
                  if pattern.match(line):
                      section[i] = f"{key} = {value}\n"
                      found = True
                      break

              if not found:
                  section.append(f"{key} = {value}\n")

          lines[start + 1:end] = section

          with open(spec, "w", encoding="utf-8") as file:
              file.writelines(lines)

          print("Buildozer ayarları güncellendi.")
          print("SDK:", sdk)
          print("P4A: develop")
          PY

      - name: Buildozer ve Cython kur
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "Cython>=3.1,<3.2" \
            buildozer

      - name: APK derle
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROIDNDK="$ANDROID_HOME/ndk/27.3.13750724"
          export ANDROID_NDK="$ANDROIDNDK"
          export ANDROID_NDK_HOME="$ANDROIDNDK"
          export ANDROIDAPI=35
          export ANDROIDMINAPI=24
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          echo "Proje dizini: $PWD"
          echo "SDK: $ANDROID_HOME"
          echo "NDK: $ANDROIDNDK"

          rm -rf .buildozer

          buildozer -v android debug 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: APK ve hata günlüğünü kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK
          path: |
            unpacked/**/bin/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 7
