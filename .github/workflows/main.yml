
name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Android araçlarını kur ve lisansları kabul et
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential autoconf automake \
            libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev \
            libssl-dev libltdl-dev

      - name: Proje ZIP dosyasını çıkar
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)"
          test -n "$ZIP_FILE" || {
            echo "HATA: Proje ZIP dosyası bulunamadı."
            exit 1
          }

          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked

          SPEC="$(find unpacked -name buildozer.spec -print -quit)"
          test -n "$SPEC" || {
            echo "HATA: buildozer.spec bulunamadı."
            exit 1
          }

          PROJECT_DIR="$(dirname "$SPEC")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SPEC=$SPEC" >> "$GITHUB_ENV"

      - name: Buildozer ve Cython kur
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython>=3.1,<4" "buildozer==1.5.0"

      - name: Android SDK lisanslarını kabul et ve paketleri kur
        shell: bash
        run: |
          set -e
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK"

          if [ -x "$SDK/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/tools/bin/sdkmanager"
          elif [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "SDK Manager henüz Buildozer tarafından indirilmemiş."
            echo "Lisans ve paket kurulumu Buildozer aşamasında yapılacak."
            exit 0
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;37.0.0"

      - name: Buildozer ayarlarını düzenle
        shell: bash
        run: |
          set -e
          python - "$SPEC" <<'PY'
          import configparser
          import sys

          path = sys.argv[1]
          c = configparser.ConfigParser(
              interpolation=None,
              strict=False
          )
          c.optionxform = str
          c.read(path)

          a = c["app"]
          a["p4a.branch"] = "v2024.01.21"
          a["android.accept_sdk_license"] = "True"

          with open(path, "w", encoding="utf-8") as f:
              c.write(f)
          PY

      - name: APK derle
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: APK dosyasını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK
          path: |
            unpacked/**/bin/*.apk
            build.log
          if-no-files-found: warn
