
      - name: Pygame 2.6.1 Cython tarifini olustur
        shell: bash
        run: |
          set -eux
          cd "$PROJECT_DIR"
          mkdir -p p4a-recipes/pygame

          cat > p4a-recipes/pygame/__init__.py <<'PY'
          import glob
          import os
          import sh

          from pythonforandroid.logger import shprint
          from pythonforandroid.recipes.pygame import Pygame2Recipe
          from pythonforandroid.toolchain import current_directory

          class Pygame261Recipe(Pygame2Recipe):
              version = "2.6.1"
              url = (
                  "https://github.com/pygame/pygame/"
                  "archive/refs/tags/{version}.tar.gz"
              )

              def build_compiled_components(self, arch):
                  env = self.get_recipe_env(arch)
                  build_dir = self.get_build_dir(arch.arch)
                  hostpython = sh.Command(self.hostpython_location)
                  cython = sh.Command("cython")

                  with current_directory(build_dir):
                      pyx_files = sorted(set(
                          glob.glob(
                              "src_c/cython/pygame/*.pyx"
                          )
                          + glob.glob(
                              "src_c/cython/pygame/**/*.pyx",
                              recursive=True
                          )
                      ))

                      if not pyx_files:
                          raise RuntimeError(
                              "Pygame .pyx kaynak dosyalari bulunamadi."
                          )

                      print(
                          f"Toplam {len(pyx_files)} Cython dosyasi "
                          "derlenecek.",
                          flush=True
                      )

                      for pyx_file in pyx_files:
                          parts = os.path.splitext(
                              pyx_file
                          )[0].split(os.path.sep)

                          # Pygame'in bekledigi C cikti yolunu kullan.
                          del parts[1:3]
                          c_file = os.path.sep.join(parts) + ".c"

                          os.makedirs(
                              os.path.dirname(c_file),
                              exist_ok=True
                          )

                          print(
                              f"Cython: {pyx_file} -> {c_file}",
                              flush=True
                          )

                          shprint(
                              cython,
                              "-3",
                              "-I", "src_c/cython",
                              "-I", "src_c/cython/pygame",
                              pyx_file,
                              "-o", c_file,
                              _env=env
                          )

                      required_c_files = [
                          "src_c/pypm.c",
                          "src_c/_sdl2/audio.c",
                      ]

                      for filename in required_c_files:
                          if not os.path.isfile(filename):
                              raise RuntimeError(
                                  f"Gerekli C dosyasi olusmadi: {filename}"
                              )

                      print(
                          "Gerekli C dosyalari olustu. "
                          "Host Python ile Pygame derleniyor.",
                          flush=True
                      )

                      shprint(
                          hostpython,
                          "setup.py",
                          "build_ext",
                          "-v",
                          _env=env
                      )

                      build_dirs = glob.glob("build/lib.*")
                      if not build_dirs:
                          raise RuntimeError(
                              "Pygame build_ext tamamlandi ancak "
                              "build/lib klasoru bulunamadi."
                          )

                      strip_command = env.get("STRIP", "").split()
                      if strip_command:
                          shprint(
                              sh.find,
                              build_dirs[0],
                              "-name", "*.o",
                              "-exec",
                              strip_command[0],
                              "--strip-unneeded",
                              "{}",
                              ";",
                              _env=env
                          )

          recipe = Pygame261Recipe()
          PY

          python -m py_compile p4a-recipes/pygame/__init__.py
          echo "Pygame tarifi hazir."
