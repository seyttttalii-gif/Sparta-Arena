
name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev \
            libltdl-dev

      - name: Proje ZIP dosyasini bul ve cikar
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 \
            -type f -iname '*.zip' \
            -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Proje ZIP dosyasi bulunamadi."
            exit 1
          fi

          mkdir -p unpacked
          echo "ZIP dosyasi: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d unpacked

          SPEC="$(find "$GITHUB_WORKSPACE/unpacked" \
            -name buildozer.spec -print -quit)"

          if [ -z "$SPEC" ]; then
            echo "HATA: buildozer.spec bulunamadi."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SPEC")" >> "$GITHUB_ENV"
          echo "SPEC=$SPEC" >> "$GITHUB_ENV"

      - name: Proje ve Pygame ayarlarini duzelt
        shell: bash
        run: |
          set -euo pipefail

          SPEC="$(find "$GITHUB_WORKSPACE/unpacked" \
            -name buildozer.spec -print -quit)"
          PROJECT_DIR="$(dirname "$SPEC")"

          if [ ! -f "$PROJECT_DIR/app/main.py" ]; then
            echo "HATA: app/main.py bulunamadi."
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/save_manager.py" ]; then
            echo "HATA: app/save_manager.py bulunamadi."
            exit 1
          fi

          mkdir -p "$PROJECT_DIR/p4a-recipes/pygame"

          cat > "$PROJECT_DIR/p4a-recipes/pygame/__init__.py" <<'PY'
          from pythonforandroid.recipes.pygame import Pygame2Recipe

          class Pygame261Recipe(Pygame2Recipe):
              version = "2.6.1"
              url = "https://github.com/pygame/pygame/archive/{version}.tar.gz"
              hostpython_prerequisites = [
                  "setuptools",
                  "cython>=3.1,<4"
              ]

          recipe = Pygame261Recipe()
          PY

          python - "$SPEC" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8").splitlines()

          start = next(
              (i for i, line in enumerate(lines)
               if line.strip().lower() == "[app]"),
              None
          )

          if start is None:
              raise SystemExit("HATA: [app] bolumu bulunamadi.")

          end = next(
              (i for i in range(start + 1, len(lines))
               if re.match(r"^\s*\[.+\]\s*$", lines[i])),
              len(lines)
          )

          def set_option(key, value):
              pattern = re.compile(
                  r"^\s*" + re.escape(key) + r"\s*=",
                  re.IGNORECASE
              )

              for i in range(start + 1, end):
                  if pattern.match(lines[i]) and not lines[i].lstrip().startswith("#"):
                      lines[i] = f"{key} = {value}"
                      return

              lines.insert(end, f"{key} = {value}")

          set_option("source.dir", "app")
          set_option("p4a.branch", "v2024.01.21")
          set_option("p4a.local_recipes", "./p4a-recipes")

          path.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("Kaynak dizini: app")
          print("Pygame yerel tarifi: 2.6.1")
          print("python-for-android: v2024.01.21")
          PY

          echo "Guncel ayarlar:"
          grep -E '^(source.dir|requirements|p4a.branch|p4a.local_recipes)' \
            "$SPEC"

      - name: Buildozer ve Cython kur
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "buildozer==1.5.0" \
            "Cython>=3.1,<4"

      - name: Android SDK klasorlerini hazirla
        run: |
          mkdir -p "$HOME/.buildozer"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

      - name: Eski derleme onbellegini temizle
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/.buildozer"
          rm -rf "$PROJECT_DIR/bin"
          echo "Eski proje derleme dosyalari temizlendi."

      - name: APK derle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f main.py ]; then
            echo "HATA: app kaynak dizininde main.py bulunamadi."
            exit 1
          fi

          (yes || true) | buildozer -v android debug 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: APK ve derleme gunlugunu yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK
          path: |
            unpacked/**/bin/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 7
