
name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem paketlerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            build-essential autoconf automake \
            libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev \
            libssl-dev libltdl-dev

      - name: Android SDK araçlarını hazırla
        shell: bash
        run: |
          set -e
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools" "$SDK/tools/bin"

          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p /tmp/android-cli
            curl -fL \
              "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
              -o /tmp/android-cli.zip
            unzip -q /tmp/android-cli.zip -d /tmp/android-cli
            mkdir -p "$SDK/cmdline-tools/latest"
            cp -a /tmp/android-cli/cmdline-tools/. \
              "$SDK/cmdline-tools/latest/"
          fi

          cat > "$SDK/tools/bin/sdkmanager" <<'SH'
          #!/usr/bin/env bash
          set -e
          SDK="$(cd "$(dirname "$0")/../.." && pwd)"
          exec "$SDK/cmdline-tools/latest/bin/sdkmanager" "$@"
          SH
          chmod +x "$SDK/tools/bin/sdkmanager"

          yes | "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" --licenses || true

          "$SDK/tools/bin/sdkmanager" \
            --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;37.0.0"

      - name: Projeyi çıkar
        shell: bash
        run: |
          set -e
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)"
          test -n "$ZIP_FILE" || {
            echo "HATA: Proje ZIP dosyası bulunamadı."
            exit 1
          }

          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked

          SPEC="$(find unpacked -name buildozer.spec -print -quit)"
          test -n "$SPEC" || {
            echo "HATA: buildozer.spec bulunamadı."
            exit 1
          }

          PROJECT_DIR="$(dirname "$SPEC")"
          echo "SPEC=$SPEC" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proje klasörü: $PROJECT_DIR"

      - name: Buildozer ve Cython kur
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython>=3.1,<4" "buildozer==1.5.0"

      - name: Pygame 2.6.1 yerel tarifini oluştur
        shell: bash
        run: |
          set -e
          mkdir -p "$PROJECT_DIR/p4a-recipes/pygame"

          cat > "$PROJECT_DIR/p4a-recipes/pygame/__init__.py" <<'PY'
          from pythonforandroid.recipes.pygame import Pygame2Recipe

          class Pygame261Recipe(Pygame2Recipe):
              version = "2.6.1"
              url = "https://github.com/pygame/pygame/archive/{version}.tar.gz"
              hostpython_prerequisites = ["setuptools", "cython>=3.1"]

          recipe = Pygame261Recipe()
          PY

      - name: Buildozer ayarlarını düzenle
        shell: bash
        run: |
          set -e
          python - "$SPEC" "$PROJECT_DIR" <<'PY'
          import configparser
          import os
          import sys

          spec, project = sys.argv[1:3]
          c = configparser.ConfigParser(
              interpolation=None,
              strict=False
          )
          c.optionxform = str
          c.read(spec)

          if not c.has_section("app"):
              raise SystemExit("HATA: [app] bölümü bulunamadı.")

          app = c["app"]
          main_dirs = []

          for root, dirs, files in os.walk(project):
              dirs[:] = [
                  d for d in dirs
                  if d not in (
                      ".git", ".buildozer", "bin", "__pycache__"
                  )
              ]
              if "main.py" in files:
                  main_dirs.append(os.path.relpath(root, project))

          if not main_dirs:
              raise SystemExit("HATA: main.py bulunamadı.")

          app["source.dir"] = main_dirs[0]

          requirements = [
              x.strip()
              for x in app.get("requirements", "python3").split(",")
              if x.strip()
          ]
          for item in ("python3", "pygame"):
              if item not in requirements:
                  requirements.append(item)

          app["requirements"] = ",".join(requirements)
          app["orientation"] = "landscape"
          app["p4a.branch"] = "v2024.01.21"
          app["p4a.local_recipes"] = "./p4a-recipes"
          app["android.accept_sdk_license"] = "True"
          app["android.api"] = "36"
          app["android.minapi"] = "24"

          with open(spec, "w", encoding="utf-8") as f:
              c.write(f)

          print("Kaynak klasörü:", app["source.dir"])
          print("Gereksinimler:", app["requirements"])
          print("Pygame yerel tarifi etkin.")
          PY

      - name: Eski başarısız derleme dosyalarını temizle
        shell: bash
        run: |
          rm -rf "$PROJECT_DIR/.buildozer"
          rm -rf "$PROJECT_DIR/bin"

      - name: APK derle
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          buildozer -v android debug \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          find bin -type f -name '*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/artifacts/" \;

          if ! find "$GITHUB_WORKSPACE/artifacts" \
            -type f -name '*.apk' | grep -q .; then
            echo "HATA: APK bulunamadı."
            exit 1
          fi

      - name: APK ve günlük dosyasını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK
          path: |
            artifacts/*.apk
            build.log
          if-no-files-found: warn
