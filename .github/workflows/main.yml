
name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Set Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev

      - name: Find and extract Sparta project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Depoda proje ZIP dosyasi bulunamadi."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked

          SPEC="$(find unpacked -type f -name buildozer.spec -print -quit)"

          if [ -z "$SPEC" ]; then
            echo "HATA: ZIP icinde buildozer.spec bulunamadi."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "SPEC=$SPEC" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Proje klasoru: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -name main.py -print

      - name: Configure Pygame recipe
        shell: bash
        run: |
          set -euo pipefail

          test -f "$SPEC"

          if [ -f "$PROJECT_DIR/app/main.py" ]; then
            SOURCE_DIR="app"
          elif [ -f "$PROJECT_DIR/main.py" ]; then
            SOURCE_DIR="."
          else
            MAIN_FILE="$(find "$PROJECT_DIR" \
              -path '*/.buildozer/*' -prune -o \
              -path '*/backend/*' -prune -o \
              -type f -name main.py -print -quit)"

            if [ -z "$MAIN_FILE" ]; then
              echo "HATA: Oyun main.py dosyasi bulunamadi."
              exit 1
            fi

            SOURCE_DIR="${MAIN_FILE#"$PROJECT_DIR"/}"
            SOURCE_DIR="$(dirname "$SOURCE_DIR")"
            [ "$SOURCE_DIR" = "." ] || true
          fi

          mkdir -p "$PROJECT_DIR/p4a-recipes/pygame"

          cat > "$PROJECT_DIR/p4a-recipes/pygame/__init__.py" <<'PYRECIPE'
          from pathlib import Path
          import subprocess

          from pythonforandroid.recipes.pygame import Pygame2Recipe

          class Pygame261Recipe(Pygame2Recipe):
              version = "2.6.1"
              url = "https://github.com/pygame/pygame/archive/{version}.tar.gz"
              hostpython_prerequisites = ["setuptools", "cython>=3.1"]

              def build_compiled_components(self, arch):
                  build_dir = Path(self.get_build_dir(arch.arch))
                  env = self.get_recipe_env(arch)

                  pyx_files = list(build_dir.rglob("*.pyx"))

                  if pyx_files:
                      cython = self.ctx.cython
                      print(
                          "Cython ile {} kaynak dosyasi hazirlaniyor".format(
                              len(pyx_files)
                          ),
                          flush=True,
                      )

                      for pyx_file in pyx_files:
                          print("Cython:", pyx_file, flush=True)
                          subprocess.run(
                              [cython, str(pyx_file)],
                              cwd=str(build_dir),
                              env=env,
                              check=True,
                          )

                  super().build_compiled_components(arch)

          recipe = Pygame261Recipe()
          PYRECIPE

          python - "$SPEC" "$SOURCE_DIR" <<'PYCONFIG'
          import sys
          from pathlib import Path

          spec = Path(sys.argv[1])
          source_dir = sys.argv[2]
          lines = spec.read_text(encoding="utf-8").splitlines()

          start = next(
              (i for i, line in enumerate(lines)
               if line.strip().lower() == "[app]"),
              None
          )

          if start is None:
              raise SystemExit("HATA: buildozer.spec icinde [app] bolumu yok.")

          end = len(lines)
          for i in range(start + 1, len(lines)):
              if lines[i].strip().startswith("[") and lines[i].strip().endswith("]"):
                  end = i
                  break

          replacements = {
              "p4a.branch": "p4a.branch = v2024.01.21",
              "p4a.local_recipes": "p4a.local_recipes = ./p4a-recipes",
              "source.dir": "source.dir = " + source_dir,
          }

          section = []
          seen = set()

          for line in lines[start + 1:end]:
              stripped = line.strip()
              key = stripped.split("=", 1)[0].strip().lower() if "=" in stripped else ""

              if key in replacements:
                  if key not in seen:
                      section.append(replacements[key])
                      seen.add(key)
                  continue

              section.append(line)

          for key, value in replacements.items():
              if key not in seen:
                  section.append(value)

          lines = lines[:start + 1] + section + lines[end:]
          spec.write_text("\n".join(lines) + "\n", encoding="utf-8")

          print("buildozer.spec guncellendi:")
          print("source.dir =", source_dir)
          print("p4a.branch = v2024.01.21")
          print("p4a.local_recipes = ./p4a-recipes")
          PYCONFIG

          echo "----- Pygame tarifi -----"
          sed -n '1,100p' "$PROJECT_DIR/p4a-recipes/pygame/__init__.py"

          echo "----- Buildozer ayarlari -----"
          grep -nE '^\s*(source\.dir|requirements|p4a\.branch|p4a\.local_recipes)\s*=' "$SPEC" || true

          test -f "$PROJECT_DIR/p4a-recipes/pygame/__init__.py"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython>=3.1" "buildozer==1.5.0"

          python -c "import Cython; print('Cython:', Cython.__version__)"
          buildozer --version

      - name: Clean old Android build cache
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/.buildozer"
          rm -rf "$PROJECT_DIR/bin"
          echo "Eski derleme onbellegi temizlendi."

      - name: Build Sparta Arena APK
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"
          buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e
          exit "$BUILD_STATUS"

      - name: Upload APK and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK-and-Log
          path: |
            unpacked/**/bin/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 7
