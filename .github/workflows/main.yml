
name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Android derleme paketlerini kur
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake \
            libffi-dev libssl-dev \
            gettext libltdl-dev

      - name: Proje ZIP dosyasini bul ve ac
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Depoda proje ZIP dosyasi bulunamadi."
            exit 1
          fi

          echo "ZIP bulundu: $ZIP_FILE"
          mkdir -p "$GITHUB_WORKSPACE/unpacked"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/unpacked"

          echo "ZIP icerigi:"
          find "$GITHUB_WORKSPACE/unpacked" -maxdepth 4 -type f \
            \( -name 'main.py' -o -name 'buildozer.spec' \) -print

      - name: Proje ve main.py konumunu otomatik bul
        shell: bash
        run: |
          set -euo pipefail

          SPEC="$(find "$GITHUB_WORKSPACE/unpacked" \
            -type f -name buildozer.spec \
            -not -path '*/.buildozer/*' | head -n 1)"

          if [ -z "$SPEC" ]; then
            echo "HATA: buildozer.spec bulunamadi."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC")"

          MAIN_FILE="$(python - "$PROJECT_DIR" <<'PY'
          import os
          import sys

          root = os.path.abspath(sys.argv[1])
          excluded = {
              ".git", ".buildozer", "bin", "venv",
              ".venv", "__pycache__", "backend",
              "tools", "tests", "test"
          }

          candidates = []

          for current, dirs, files in os.walk(root):
              dirs[:] = sorted(
                  d for d in dirs
                  if d not in excluded
              )

              if "main.py" in files:
                  candidates.append(
                      os.path.join(current, "main.py")
                  )

          if not candidates:
              print(
                  "HATA: Proje klasorunde uygun main.py bulunamadi.",
                  file=sys.stderr
              )
              sys.exit(1)

          def priority(path):
              rel = os.path.relpath(path, root).replace("\\", "/")
              if rel == "app/main.py":
                  return (0, rel)
              if rel == "main.py":
                  return (1, rel)
              return (2, rel)

          candidates.sort(key=priority)
          print(candidates[0])
          PY
          )"

          MAIN_DIR="$(dirname "$MAIN_FILE")"
          SOURCE_DIR="$(python -c \
            'import os,sys; print(os.path.relpath(sys.argv[1],sys.argv[2]))' \
            "$MAIN_DIR" "$PROJECT_DIR")"

          echo "Proje: $PROJECT_DIR"
          echo "Ana dosya: $MAIN_FILE"
          echo "Kaynak dizini: $SOURCE_DIR"

          test -f "$MAIN_FILE"

          python - "$SPEC" "$SOURCE_DIR" <<'PY'
          import re
          import sys

          spec_path, source_dir = sys.argv[1:3]

          with open(spec_path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          output = []
          in_app = False
          source_written = False

          for line in lines:
              section = re.match(r"^\s*\[([^\]]+)\]", line)

              if section:
                  if in_app and not source_written:
                      output.append(f"source.dir = {source_dir}\n")
                      source_written = True
                  in_app = section.group(1).strip().lower() == "app"

              if in_app and re.match(r"^\s*#?\s*source\.dir\s*=", line):
                  if not source_written:
                      output.append(f"source.dir = {source_dir}\n")
                      source_written = True
                  continue

              output.append(line)

          if in_app and not source_written:
              output.append(f"source.dir = {source_dir}\n")

          with open(spec_path, "w", encoding="utf-8") as f:
              f.writelines(output)

          print("buildozer.spec source.dir ayari:", source_dir)
          PY

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "SPEC=$SPEC" >> "$GITHUB_ENV"

      - name: Pygame 2.6.1 tarifini hazirla
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROJECT_DIR/p4a-recipes/pygame"

          cat > "$PROJECT_DIR/p4a-recipes/pygame/__init__.py" <<'PY'
          from pythonforandroid.recipes.pygame import Pygame2Recipe

          class Pygame261Recipe(Pygame2Recipe):
              version = "2.6.1"
              url = "https://github.com/pygame/pygame/archive/{version}.tar.gz"
              hostpython_prerequisites = [
                  "setuptools",
                  "cython>=3.1,<4"
              ]

          recipe = Pygame261Recipe()
          PY

          python - "$SPEC" <<'PY'
          import re
          import sys

          path = sys.argv[1]

          with open(path, "r", encoding="utf-8") as f:
              lines = f.readlines()

          settings = {
              "p4a.branch": "v2024.01.21",
              "p4a.local_recipes": "./p4a-recipes",
          }

          output = []
          in_app = False
          written = set()

          for line in lines:
              section = re.match(r"^\s*\[([^\]]+)\]", line)

              if section:
                  if in_app:
                      for key, value in settings.items():
                          if key not in written:
                              output.append(f"{key} = {value}\n")
                              written.add(key)
                  in_app = section.group(1).strip().lower() == "app"

              matched = None
              if in_app:
                  for key in settings:
                      if re.match(r"^\s*#?\s*" + re.escape(key) + r"\s*=", line):
                          matched = key
                          break

              if matched:
                  if matched not in written:
                      output.append(f"{matched} = {settings[matched]}\n")
                      written.add(matched)
                  continue

              output.append(line)

          if in_app:
              for key, value in settings.items():
                  if key not in written:
                      output.append(f"{key} = {value}\n")

          with open(path, "w", encoding="utf-8") as f:
              f.writelines(output)

          print("P4A ve yerel Pygame tarifi ayarlandi.")
          PY

          echo "buildozer.spec kontrolu:"
          grep -E '^(source.dir|requirements|p4a.branch|p4a.local_recipes)[[:space:]]*=' "$SPEC" || true

      - name: Buildozer kur
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython>=3.1,<4" "buildozer==1.5.0"

      - name: Sparta Arena APK derle
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f "main.py" ] && [ -n "${SOURCE_DIR:-}" ]; then
            :
          fi

          rm -rf .buildozer bin

          set -o pipefail
          (yes || true) | buildozer -v android debug 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: APK ve hata kaydini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK-ve-Log
          path: |
            unpacked/**/bin/*.apk
            build.log
          if-no-files-found: warn
