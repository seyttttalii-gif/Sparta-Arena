name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem bağımlılıklarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential autoconf automake \
            libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: Android SDK araçlarını kur
        uses: android-actions/setup-android@v3

      - name: Android SDK yolunu sabitle ve paketleri yükle
        shell: bash
        run: |
          set -e

          SDKMANAGER="$(find "${ANDROID_HOME:-$HOME/.android/sdk}" \
            /usr/local/lib/android/sdk \
            -type f -path '*/cmdline-tools/*/bin/sdkmanager' \
            -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "HATA: Android sdkmanager bulunamadı."
            exit 1
          fi

          SDK_ROOT="${SDKMANAGER%%/cmdline-tools/*}"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;35.0.0" \
            "ndk;25.1.8937393"

          echo "Android SDK yolu: $SDK_ROOT"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Proje ZIP dosyasını aç
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -iname '*.zip' -not -path './.git/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Depoda proje ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "Bulunan ZIP: $ZIP_FILE"
          mkdir -p unpacked
          unzip -oq "$ZIP_FILE" -d unpacked

          SPEC="$(find unpacked -name buildozer.spec -print -quit)"

          if [ -z "$SPEC" ]; then
            echo "HATA: ZIP içinde buildozer.spec bulunamadı."
            find unpacked -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT="$(dirname "$SPEC")"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proje dizini: $PROJECT"

      - name: Pygame ve PyJNIus tariflerini hazırla
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(dirname "$(find unpacked -name buildozer.spec -print -quit)")"

          mkdir -p "$PROJECT/p4a-recipes/pyjnius"
          mkdir -p "$PROJECT/p4a-recipes/pygame"

          # PyJNIus 1.7.0, eski "long" Cython hatasını düzeltir.
          cat > "$PROJECT/p4a-recipes/pyjnius/__init__.py" <<'PY'
          from pythonforandroid.recipes.pyjnius import (
              PyjniusRecipe as BasePyjniusRecipe
          )

          class Pyjnius170Recipe(BasePyjniusRecipe):
              version = "1.7.0"
              url = "https://github.com/kivy/pyjnius/archive/{version}.zip"
              hostpython_prerequisites = [
                  "setuptools",
                  "Cython>=3.1,<3.2",
              ]

          recipe = Pyjnius170Recipe()
          PY

          # ZIP içinde Pygame tarifi yoksa Cython derlemesini destekleyen
          # Pygame 2.6.1 tarifi oluştur.
          if [ ! -f "$PROJECT/p4a-recipes/pygame/__init__.py" ]; then
            cat > "$PROJECT/p4a-recipes/pygame/__init__.py" <<'PY'
          import sh
          from pythonforandroid.recipes.pygame import Pygame2Recipe
          from pythonforandroid.util import current_directory, shprint

          class Pygame261Recipe(Pygame2Recipe):
              version = "2.6.1"
              url = "https://github.com/pygame/pygame/archive/refs/tags/{version}.tar.gz"
              hostpython_prerequisites = [
                  "setuptools",
                  "Cython>=3.1,<3.2",
              ]

              def build_compiled_components(self, arch):
                  env = self.get_recipe_env(arch)

                  with current_directory(self.get_build_dir(arch.arch)):
                      hostpython = sh.Command(self.ctx.hostpython)

                      try:
                          shprint(
                              hostpython,
                              "setup.py",
                              "build_ext",
                              _env=env,
                          )
                      except sh.ErrorReturnCode_1:
                          print(
                              "İlk Cython derlemesi başarısız oldu; "
                              "PYX dosyaları hazırlanacak.",
                              flush=True,
                          )

                      shprint(
                          sh.find,
                          ".",
                          "-iname",
                          "*.pyx",
                          "-exec",
                          self.ctx.cython,
                          "{}",
                          ";",
                          _env=env,
                      )

                      shprint(
                          hostpython,
                          "setup.py",
                          "build_ext",
                          "-v",
                          _env=env,
                      )

          recipe = Pygame261Recipe()
          PY
          fi

          # Buildozer ayarlarında yerel tarifleri ve p4a sürümünü sabitle.
          if grep -qE '^[[:space:]]*p4a.branch[[:space:]]*=' "$PROJECT/buildozer.spec"; then
            sed -i -E \
              's|^[[:space:]]*p4a.branch[[:space:]]*=.*|p4a.branch = v2024.01.21|' \
              "$PROJECT/buildozer.spec"
          else
            sed -i '/^\[app\]/a p4a.branch = v2024.01.21' \
              "$PROJECT/buildozer.spec"
          fi

          if grep -qE '^[[:space:]]*p4a.local_recipes[[:space:]]*=' "$PROJECT/buildozer.spec"; then
            sed -i -E \
              's|^[[:space:]]*p4a.local_recipes[[:space:]]*=.*|p4a.local_recipes = ./p4a-recipes|' \
              "$PROJECT/buildozer.spec"
          else
            sed -i '/^\[app\]/a p4a.local_recipes = ./p4a-recipes' \
              "$PROJECT/buildozer.spec"
          fi

          echo "PyJNIus tarifi:"
          grep -E 'version|url|Cython' "$PROJECT/p4a-recipes/pyjnius/__init__.py"

          echo "Pygame tarifi:"
          grep -E 'version|url|Cython' "$PROJECT/p4a-recipes/pygame/__init__.py"

      - name: Buildozer ve Cython kur
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "Cython>=3.1,<3.2" \
            buildozer

      - name: APK derle
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          export ANDROID_HOME="${ANDROID_HOME:-$HOME/.android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROIDNDK="$ANDROID_HOME/ndk/25.1.8937393"
          export ANDROID_NDK="$ANDROIDNDK"
          export ANDROID_NDK_HOME="$ANDROIDNDK"
          export ANDROIDAPI=34
          export ANDROIDMINAPI=24
          export PATH="$ANDROID_HOME/platform-tools:$PATH"

          if [ ! -x "$ANDROID_HOME/ndk/25.1.8937393/ndk-build" ]; then
            echo "HATA: Beklenen Android NDK bulunamadı:"
            echo "$ANDROID_HOME/ndk/25.1.8937393"
            exit 1
          fi

          # Önceki başarısız derlemenin önbelleğini kullanma.
          rm -rf .buildozer

          echo "Proje: $PWD"
          echo "SDK: $ANDROID_HOME"
          echo "NDK: $ANDROIDNDK"
          echo "APK derlemesi başlıyor..."

          buildozer -v android debug 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: APK ve hata günlüğünü kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK
          path: |
            unpacked/**/bin/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 7
