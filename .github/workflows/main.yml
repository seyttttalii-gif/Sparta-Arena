name: Sparta Arena APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Repository indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: ZIP dosyasını bul ve çıkar
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: ZIP dosyası bulunamadı"
            exit 1
          fi
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked
          find unpacked -name buildozer.spec -print

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: APK derle
        run: |
          SPEC="$(find unpacked -name buildozer.spec -print -quit)"
          if [ -z "$SPEC" ]; then
            echo "HATA: buildozer.spec bulunamadı"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SPEC")"
          cd "$PROJECT_DIR"
          buildozer -v android debug

      - name: APK dosyasını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK
          path: unpacked/**/bin/*.apk
          if-no-files-found: warn
