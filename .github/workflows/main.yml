
name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential autoconf automake \
            libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            openjdk-17-jdk

      - name: ZIP dosyasını bul ve çıkar
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Depoda ZIP dosyası bulunamadı."
            exit 1
          fi

          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked

          SPEC="$(find unpacked -name buildozer.spec -print -quit)"
          if [ -z "$SPEC" ]; then
            echo "HATA: ZIP içinde buildozer.spec bulunamadı."
            exit 1
          fi

          echo "Proje bulundu: $SPEC"

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Android SDK lisanslarını kabul et
        run: |
          mkdir -p "$HOME/.buildozer"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

      - name: APK derle
        env:
          P4A_RELEASE_KEYSTORE: ""
        run: |
          set -o pipefail

          SPEC="$(find "$GITHUB_WORKSPACE/unpacked" -name buildozer.spec -print -quit)"
          if [ -z "$SPEC" ]; then
            echo "HATA: buildozer.spec bulunamadı."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC")"
          cd "$PROJECT_DIR"

          yes | buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: APK dosyasını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK
          path: |
            unpacked/**/bin/*.apk
            build.log
          if-no-files-found: warn
