
name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11 kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Android derleme bağımlılıklarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            build-essential \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake \
            libffi-dev libssl-dev \
            libltdl-dev

      - name: Proje ZIP dosyasını bul ve çıkar
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Depoda proje ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "ZIP dosyası: $ZIP_FILE"
          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked

          echo "Bulunan Buildozer dosyaları:"
          find unpacked -name buildozer.spec -print

          SPEC="$(find unpacked -name buildozer.spec -print -quit)"

          if [ -z "$SPEC" ]; then
            echo "HATA: ZIP içinde buildozer.spec bulunamadı."
            echo "ZIP içeriğini kontrol et."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SPEC")" >> "$GITHUB_ENV"

      - name: Buildozer ve Python paketlerini kur
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Android SDK ve NDK ile APK derle
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          echo "Proje dizini: $PWD"
          echo "Buildozer ayarları:"
          grep -E '^(title|package.name|package.domain|source.dir|source.include_exts|version|requirements|orientation|android.api|android.minapi|android.ndk)' buildozer.spec || true

          if [ ! -f main.py ]; then
            echo "HATA: Proje dizininde main.py bulunamadı."
            find . -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          buildozer -v android debug

      - name: APK dosyasını yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK
          path: |
            **/bin/*.apk
          if-no-files-found: warn
          retention-days: 7
