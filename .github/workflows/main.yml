name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sistem bağımlılıklarını kur
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl \
            build-essential autoconf automake \
            libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 cmake libffi-dev libssl-dev

      - name: Android SDK araçlarını kur
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: ""

      - name: Android SDK ve NDK kur
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find \
              /usr/local/lib/android/sdk \
              "$HOME/.android/sdk" \
              -type f \
              -path '*/cmdline-tools/*/bin/sdkmanager' \
              -print -quit 2>/dev/null || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "HATA: sdkmanager bulunamadı."
            exit 1
          fi

          SDK_ROOT="${SDKMANAGER%%/cmdline-tools/*}"

          if [ "$SDK_ROOT" = "$SDKMANAGER" ]; then
            echo "HATA: Android SDK dizini belirlenemedi."
            exit 1
          fi

          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/tools/bin" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          # Buildozer eski tools/bin yolunu bekliyor.
          # Gerçek sdkmanager dosyasını bu yol üzerinden çağır.
          mkdir -p "$SDK_ROOT/tools/bin"

          cat > "$SDK_ROOT/tools/bin/sdkmanager" <<EOF
          #!/usr/bin/env bash
          exec "$SDKMANAGER" --sdk_root="$SDK_ROOT" "\$@"
          EOF

          chmod +x "$SDK_ROOT/tools/bin/sdkmanager"

          # Lisansları kabul et.
          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          # Eski ve artık bulunmayan "tools" paketini kurma.
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

          test -x "$SDK_ROOT/tools/bin/sdkmanager"
          test -x "$SDK_ROOT/build-tools/35.0.0/aidl"
          test -x "$SDK_ROOT/ndk/28.2.13676358/ndk-build"

          echo "ANDROID_NDK=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "SDK kontrolü başarılı: $SDK_ROOT"

      - name: Proje ZIP dosyasını aç
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 4 -type f \
            -iname '*.zip' \
            -not -path './.git/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Proje ZIP dosyası bulunamadı."
            echo "Depoya proje ZIP dosyasını eklediğini kontrol et."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          mkdir -p unpacked
          unzip -oq "$ZIP_FILE" -d unpacked

          SPEC="$(find unpacked -name buildozer.spec -print -quit)"

          if [ -z "$SPEC" ]; then
            echo "HATA: ZIP içinde buildozer.spec bulunamadı."
            find unpacked -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT="$(dirname "$SPEC")"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Proje dizini: $PROJECT"

      - name: Pygame tarifini hazırla
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(dirname "$(find unpacked -name buildozer.spec -print -quit)")"

          mkdir -p "$PROJECT/p4a-recipes/pygame"

          # Önceki denemelerden kalan tarifin eski kodunu kullanma.
          cat > "$PROJECT/p4a-recipes/pygame/__init__.py" <<'PY'
          from pythonforandroid.recipes.pygame import Pygame2Recipe

          class Pygame261Recipe(Pygame2Recipe):
              version = "2.6.1"
              url = "https://github.com/pygame/pygame/archive/refs/tags/{version}.tar.gz"
              hostpython_prerequisites = [
                  "setuptools",
                  "Cython>=3.1,<3.2",
              ]

          recipe = Pygame261Recipe()
          PY

          # PyJNIus'un eski yerel tarifini kaldır.
          # P4A develop kendi PyJNIus 1.7.0 tarifini kullanır.
          rm -rf "$PROJECT/p4a-recipes/pyjnius"

          echo "Yerel Pygame tarifi hazır."
          cat "$PROJECT/p4a-recipes/pygame/__init__.py"

      - name: Buildozer ayarlarını düzenle
        shell: bash
        run: |
          set -euo pipefail

          python - "$PROJECT_DIR/buildozer.spec" <<'PY'
          import os
          import re
          import sys

          spec = sys.argv[1]
          sdk = os.environ["ANDROID_HOME"]
          ndk = os.path.join(sdk, "ndk", "28.2.13676358")

          with open(spec, "r", encoding="utf-8") as f:
              lines = f.readlines()

          start = None
          for i, line in enumerate(lines):
              if line.strip().lower() == "[app]":
                  start = i
                  break

          if start is None:
              raise SystemExit("HATA: buildozer.spec içinde [app] bulunamadı.")

          end = len(lines)
          for i in range(start + 1, len(lines)):
              if re.match(r"^\s*\[.+\]\s*$", lines[i]):
                  end = i
                  break

          settings = {
              "android.sdk_path": sdk,
              "android.ndk_path": ndk,
              "android.api": "35",
              "android.minapi": "24",
              "android.ndk": "28c",
              "android.build_tools_version": "35.0.0",
              "android.accept_sdk_license": "True",
              "android.skip_update": "True",
              "p4a.branch": "develop",
              "p4a.local_recipes": "./p4a-recipes",
          }

          section = lines[start + 1:end]

          for key, value in settings.items():
              pattern = re.compile(r"^\s*" + re.escape(key) + r"\s*=")
              found = False

              for i, line in enumerate(section):
                  if pattern.match(line):
                      section[i] = f"{key} = {value}\n"
                      found = True
                      break

              if not found:
                  section.append(f"{key} = {value}\n")

          lines[start + 1:end] = section

          with open(spec, "w", encoding="utf-8") as f:
              f.writelines(lines)

          print("Buildozer ayarları kaydedildi.")
          print("SDK:", sdk)
          print("NDK:", ndk)
          print("Python-for-Android: develop")
          PY

      - name: Buildozer ve Cython kur
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "Cython>=3.1,<3.2" \
            "buildozer==1.5.0"

          python -m cython --version
          buildozer --version

      - name: APK derle
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"

          export ANDROID_HOME
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROIDSDK="$ANDROID_HOME"
          export ANDROID_NDK="$ANDROID_HOME/ndk/28.2.13676358"
          export ANDROID_NDK_HOME="$ANDROID_NDK"
          export ANDROIDNDK="$ANDROID_NDK"
          export ANDROIDAPI=35
          export ANDROIDMINAPI=24
          export PATH="$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "Proje: $PWD"
          echo "SDK: $ANDROID_HOME"
          echo "NDK: $ANDROID_NDK"

          # Eski ve başarısız derleme önbelleğini temizle.
          rm -rf .buildozer

          buildozer -v android debug 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: APK ve hata günlüğünü kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK
          path: |
            unpacked/**/bin/*.apk
            build.log
          if-no-files-found: warn
          retention-days: 7
