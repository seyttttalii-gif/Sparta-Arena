
name: Sparta Arena APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerekli paketleri kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip build-essential autoconf automake \
            libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev

      - name: ZIP dosyasini bul ve cikar
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Depoda ZIP dosyasi bulunamadi."
            exit 1
          fi

          mkdir -p unpacked
          unzip -q "$ZIP_FILE" -d unpacked

          SPEC="$(find unpacked -name buildozer.spec -print -quit)"

          if [ -z "$SPEC" ]; then
            echo "HATA: ZIP icinde buildozer.spec bulunamadi."
            exit 1
          fi

          echo "Proje bulundu: $SPEC"

      - name: Pygame 2.6.1 yerel tarifini hazirla
        run: |
          set -e

          SPEC="$(find "$GITHUB_WORKSPACE/unpacked" -name buildozer.spec -print -quit)"

          if [ -z "$SPEC" ]; then
            echo "HATA: buildozer.spec bulunamadi."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC")"

          mkdir -p "$PROJECT_DIR/p4a-recipes/pygame"

          cat > "$PROJECT_DIR/p4a-recipes/pygame/__init__.py" <<'PY'
          from pythonforandroid.recipes.pygame import Pygame2Recipe

          class Pygame261Recipe(Pygame2Recipe):
              version = "2.6.1"
              url = "https://github.com/pygame/pygame/archive/{version}.tar.gz"
              hostpython_prerequisites = ["setuptools", "cython>=3.1"]

          recipe = Pygame261Recipe()
          PY

          python - "$SPEC" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()

          if not any(line.strip().startswith("p4a.local_recipes") for line in lines):
              index = next(
                  i for i, line in enumerate(lines)
                  if line.strip().startswith("requirements")
              )
              lines.insert(index + 1, "p4a.local_recipes = ./p4a-recipes")

          path.write_text("\n".join(lines) + "\n")
          print("Pygame yerel tarifi etkinlestirildi.")
          PY

      - name: Buildozer kur
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.37

      - name: Android SDK klasorlerini hazirla
        run: |
          mkdir -p "$HOME/.buildozer"
          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

      - name: APK derle
        run: |
          set -e
          set -o pipefail

          SPEC="$(find "$GITHUB_WORKSPACE/unpacked" -name buildozer.spec -print -quit)"

          if [ -z "$SPEC" ]; then
            echo "HATA: buildozer.spec bulunamadi."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SPEC")"
          cd "$PROJECT_DIR"

          yes | buildozer -v android debug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: APK ve gunluk dosyalarini yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sparta-Arena-APK
          path: |
            unpacked/**/bin/*.apk
            build.log
          if-no-files-found: warn
